<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Fundo de Luz Ambiente Decorativo -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
    <div class="ambient-glow glow-4"></div>

    <!-- Tela de Carregamento com Logo Mais Grossa e Líquido no Fundo -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="liquid-bg-wrapper">
                <div class="liquid-bg"></div>
                <div class="liquid-bg-wave"></div>
                <div id="logo-symbol" class="logo-symbol bold-logo">&lt;/&gt;</div>
            </div>
        </div>
    </div>

    <!-- Controles Rápidos -->
    <div class="index-controls">
        <button id="lang-toggle" class="control-btn lang-btn" title="Mudar Idioma" aria-label="Mudar Idioma">PT</button>
    </div>

    <!-- Página Home de Transição -->
    <main id="home-page" class="home-page hidden">
        <div class="glass-card">
            <header class="card-header">
                <h1 class="welcome-title" data-i18n="welcomeTitle">Olá, seja bem-vindo(a)! <span class="sparkle"></span>
                </h1>
                <a href="about.html" class="btn btn-glow" data-i18n="welcomeBtn">ir para pagina inicial →</a>
            </header>
        </div>
    </main>
</body>

</html>
