<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Projects</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='projetosstyle.css'>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Fundo de Luz Ambiente Decorativo -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
    <div class="ambient-glow glow-4"></div>

    <!-- Tela de Carregamento com Logo Mais Grossa e Líquido no Fundo -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="liquid-bg-wrapper">
                <div class="liquid-bg"></div>
                <div class="liquid-bg-wave"></div>
                <div id="logo-symbol" class="logo-symbol bold-logo">&lt;/&gt;</div>
            </div>
        </div>
    </div>

    <!-- Cabeçalho & Menu -->
    <header class="navbar-header">
        <a href="index.html" class="brand-logo">Lys<span>.</span></a>

        <div class="header-controls">
            <button id="lang-toggle" class="control-btn lang-btn" title="Mudar Idioma"
                aria-label="Mudar Idioma">PT</button>
            <button id="header-h1" class="menu-btn" title="Abrir menu" aria-label="Abrir menu">≡</button>
        </div>
    </header>

    <!-- Overlay do Menu -->
    <div id="menu-backdrop" class="menu-backdrop"></div>

    <!-- Menu Lateral -->
    <nav id="side-menu" class="side-menu">
        <button id="close-menu" class="close-btn" title="Fechar menu">&times;</button>
        <div class="menu-header">
            <span class="menu-title" data-i18n="navTitle">Navegação</span>
        </div>
        <ul>
            <li><a href="index.html"><span class="nav-num">01</span> <span data-i18n="navHome">Início</span></a></li>
            <li><a href="about.html"><span class="nav-num">02</span> <span data-i18n="navAbout">Sobre</span></a></li>
            <li class="active_menu"><a class="active_menu" href="projetos.html"><span class="nav-num">03</span> <span
                        data-i18n="navProjects">Projetos</span></a></li>
        </ul>
    </nav>

    <!-- Apresentação Hero Projetos -->
    <main>
        <section class="start-presentation">
            <div class="badge-pill" data-i18n="badgeProjects">🚀 Portfolio & Criações</div>
            <h1 id="hi" data-i18n="projectsTitle">Meus <span class="gradient-text">Projetos</span></h1>
            <p class="hero-subtext" data-i18n="projectsSub">Confira os principais projetos em que venho trabalhando
                ultimamente.</p>
        </section>

        <!-- Grid de Projetos Esvaziado -->
        <section class="projects-section">
            <div class="empty-projects-container reveal">
                <div class="empty-icon">✨</div>
                <h3 data-i18n="emptyProjectsTitle">Projetos em Breve</h3>
                <p data-i18n="emptyProjectsSub">Novas criações e projetos serão adicionados aqui em breve. Fique atento!
                </p>
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="footer-content">
            <p><span data-i18n="footerHeart">Feito com</span> <span class="heart-icon">❤️</span> <span
                    data-i18n="footerBy">por</span> <strong>Lys</strong></p>
            <div class="social_links">
                <a href="https://x.com/ssuplys" class="social_button" target="_blank" title="X (Twitter)"
                    aria-label="X (Twitter)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/ce/X_logo_2023.svg" alt="X (Twitter)"
                        class="social_img">
                </a>
                <a href="#"
                    onclick="event.preventDefault(); navigator.clipboard.writeText('@ssuplys'); alert('Discord copiado: @ssuplys');"
                    class="social_button" title="Discord" aria-label="Discord">
                    <img src="https://cdn.pixabay.com/photo/2022/10/09/17/21/discord-7509681_1280.png" alt="Discord"
                        class="social_img">
                    <span class="tooltip_text" data-i18n="copyDiscord">@ssuplys</span>
                </a>
                <a href="https://github.com/ssuplys" class="social_button" target="_blank" title="GitHub"
                    aria-label="GitHub">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub"
                        class="social_img">
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
